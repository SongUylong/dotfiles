# ── macOS settings ────────────────────────────────────────────────────────────
hide_window_decorations titlebar-only
font_size 16.0
# Important for Alt/Meta keys in tmux on macOS
macos_option_as_alt left

# ── Khmer Script Font Mappings & Shaping ─────────────────────────────────────
symbol_map U+1780-U+17FF,U+19E0-U+19FF Khmer Sangam MN, Khmer
text_composition_strategy platform

# ── Performance ───────────────────────────────────────────────────────────────
repaint_delay 8
sync_to_monitor no

# ── Window Layout & Padding ──────────────────────────────────────────────────
window_padding_width 15

# ── Remote Control (Fast Image Protocol IPC) ──────────────────────────────────
allow_remote_control yes
listen_on unix:/tmp/mykitty

# ── General ───────────────────────────────────────────────────────────────────
tab_bar_min_tabs 1
confirm_os_window_close 1
disable_ligatures always
scrollback_lines 3000
inactive_text_alpha 0.5
enabled_layouts splits,stack,tall

# ── Tab bar ───────────────────────────────────────────────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {index} ➔ {title[:18]} "
active_tab_title_template " {index} ➔ {title[:18]} "
active_tab_font_style bold
inactive_tab_font_style normal

# ── Key bindings ──────────────────────────────────────────────────────────────
# Tab management
map cmd+n show_scrollback
map cmd+t new_tab_with_cwd
map cmd+x close_tab

# Pane (window) management & switching
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+w close_window
map cmd+alt+x close_other_windows_in_tab
map cmd+z toggle_layout stack

# Pane navigation (switch panes)
map cmd+[ previous_window
map cmd+] next_window
map cmd+alt+left neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up neighboring_window up
map cmd+alt+down neighboring_window down
map cmd+alt+h neighboring_window left
map cmd+alt+l neighboring_window right
map cmd+alt+k neighboring_window up
map cmd+alt+j neighboring_window down

# Block Alt+e (used by AeroSpace)
map alt+e no_op

# Tab / Window number shortcuts (CMD+1..9 and ALT+1..9)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# ── Mouse bindings ────────────────────────────────────────────────────────────
mouse_map ctrl+left release grabbed,ungrabbed open_url_with_hits

# ── Color Scheme ──────────────────────────────────────────────────────────────
include theme.conf
